# One command (`make up` / `docker compose up --build -d`) runs the whole pipeline:
#   minio, postgres -> init-buckets -> api -> partner-sim (after fetch-ved) -> spark-job
#   -> loader -> dq-report -> dashboard
# One-shot steps are chained with service_completed_successfully; long-running services
# with healthchecks are chained with service_healthy.
name: ved-pipeline

x-env: &env
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  RAW_BUCKET: raw
  CURATED_BUCKET: curated
  REPORTS_BUCKET: reports
  PG_DSN: postgresql://${POSTGRES_USER:-ved}:${POSTGRES_PASSWORD:-ved}@postgres:5432/${POSTGRES_DB:-ved}
  API_KEYS: ${API_KEYS:-partner-a:dev-key-a}
  API_URL: http://api:8000
  API_KEY: ${PARTNER_API_KEY:-dev-key-a}
  VED_DATA_DIR: /data/ved
  VED_WEEKS: ${VED_WEEKS:-2}
  SIM_SEED: ${SIM_SEED:-42}
  FAULT_DUPLICATE_RATE: ${FAULT_DUPLICATE_RATE:-0.02}
  FAULT_LATE_RATE: ${FAULT_LATE_RATE:-0.03}
  FAULT_PARTIAL_RATE: ${FAULT_PARTIAL_RATE:-0.01}
  FAULT_SPEED_SPIKE_RATE: ${FAULT_SPEED_SPIKE_RATE:-0.01}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-app: &app
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  image: ved-pipeline-app:local
  environment: *env

services:
  minio:
    # Community images are no longer on Docker Hub. This tag is frozen and unpatched:
    # acceptable for a local demo only, never for a deployment.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    restart: unless-stopped

  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ved}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ved}
      POSTGRES_DB: ${POSTGRES_DB:-ved}
    ports: ["5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  init-buckets:
    <<: *app
    # Waits for MinIO itself (boto3 retry loop), so it only needs MinIO to be started.
    command: ["python", "-m", "vedpipe.infra", "init-buckets"]
    depends_on:
      minio:
        condition: service_started

  fetch-ved:
    <<: *app
    command: ["python", "-m", "vedpipe.sim.fetch"]
    volumes: ["ved-data:/data/ved"]

  api:
    <<: *app
    command: ["uvicorn", "vedpipe.api.main:create_app", "--factory",
              "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    depends_on:
      init-buckets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  partner-sim:
    <<: *app
    command: ["python", "-m", "vedpipe.sim.replay"]
    volumes: ["ved-data:/data/ved"]
    depends_on:
      api:
        condition: service_healthy
      fetch-ved:
        condition: service_completed_successfully

  spark-job:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    image: ved-pipeline-spark:local
    environment:
      <<: *env
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
    command: ["python", "-m", "vedpipe.spark.job"]
    depends_on:
      partner-sim:
        condition: service_completed_successfully

  loader:
    <<: *app
    command: ["python", "-m", "vedpipe.load.loader"]
    volumes: ["ved-data:/data/ved:ro"]
    depends_on:
      spark-job:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  dq-report:
    <<: *app
    command: ["python", "-m", "vedpipe.quality.report"]
    depends_on:
      loader:
        condition: service_completed_successfully

  dashboard:
    <<: *app
    command: ["streamlit", "run", "dashboard/app.py", "--server.port", "8501",
              "--server.address", "0.0.0.0", "--server.headless", "true"]
    ports: ["8501:8501"]
    depends_on:
      dq-report:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  minio-data:
  pg-data:
  ved-data:
